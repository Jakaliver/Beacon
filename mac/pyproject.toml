[project]
name = "beacon"
version = "0.1.0"
description = "Beacon Mac backend: perception, reconstruction, target tracking, guidance"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "numpy==2.4.6",
  "opencv-python==5.0.0.93",
  "pillow==13.0.0",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "ultralytics==8.4.205",
  "mlx==0.32.4",
  "parakeet-mlx==0.7.0",
  "huggingface-hub==2.4.0",
  "psutil==7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beacon"]
