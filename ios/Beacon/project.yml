name: Beacon
options:
  bundleIdPrefix: ai.trident
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M9AC3A7N78
    CODE_SIGN_STYLE: Automatic
targets:
  Beacon:
    type: application
    platform: iOS
    sources: [Beacon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trident.app.m9ac3a7n78
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    # Paid teams only: add the Head Pose entitlement back for Apple's automatic head tracking
    # (entitlements: com.apple.developer.coremotion.head-pose: true) and set
    # AudioGuide.automaticHeadTracking = true. Personal teams cannot sign it.
    info:
      path: Beacon/Info.plist
      properties:
        CFBundleDisplayName: Beacon
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: Beacon uses the camera to map the room and find objects for you.
        NSMicrophoneUsageDescription: Beacon records a request when you hold Talk to Beacon or activate its Action button shortcut.
        NSMotionUsageDescription: Beacon uses headphone motion to keep guidance sounds fixed in the room.
        NSLocalNetworkUsageDescription: Beacon sends camera frames to your Mac on the local network and receives guidance.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  BeaconVoiceLab:
    type: application
    platform: iOS
    sources:
      - VoiceLab
      - Beacon/VoiceCommand.swift
      - Beacon/VoiceSession.swift
      - Beacon/VoiceListener.swift
      - Beacon/VoiceModeControls.swift
      - Beacon/Speech.swift
      - Beacon/Settings.swift
      - Beacon/GuidanceSoundSettings.swift
      - Beacon/AudioGuide.swift
      - Beacon/TargetProximity.swift
      - Beacon/GuidanceSounds.swift
      - Beacon/chest_loop.wav
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trident.voicelab.m9ac3a7n78
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: VoiceLab/Info.plist
      properties:
        CFBundleDisplayName: Beacon Voice Lab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Voice Lab listens for your commands while voice mode is on.
        NSSpeechRecognitionUsageDescription: Voice Lab uses on-device speech recognition to test hands-free controls.
        NSMotionUsageDescription: Voice Lab uses headphone motion to keep the sample object sound in one place.
