<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b1b1b" />
  <meta name="description" content="Your live room scan from Beacon on iPhone." />
  <title>Beacon · Room view</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b1b1b'/%3E%3Cpath d='M16 26V6M8 8v7q0 5 8 5t8-5V8' fill='none' stroke='%23dedede' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="toolbar">
    <h1 class="brand">Beacon</h1>
    <nav aria-label="View controls">
      <div class="view-switch">
        <button id="viewFirst" aria-pressed="false" aria-label="First person" title="See the scan from the iPhone camera" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z" /><circle cx="8" cy="8" r="2" /></svg>1st</button>
        <button id="view3d" aria-pressed="true" aria-label="3D" title="Orbit the room scan"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.5 3v7L8 14.5l-5.5-3v-7zM2.5 4.5L8 7.5l5.5-3M8 7.5v7" /></svg>3D</button>
      </div>
      <button id="viewColour" aria-pressed="false" title="Use the camera image colours">Colour</button>
      <button id="fitRoom" title="Keep the whole scan in view"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2v4m8-4h4v4M2 10v4h4m8-4v4h-4" /></svg>Fit</button>
      <button id="debugToggle" aria-pressed="false" aria-controls="debugPanel" title="Show debug information (D)">Debug</button>
    </nav>
  </header>
  <main aria-label="Room reconstruction">
    <canvas id="roomCanvas" tabindex="0" aria-label="Interactive room scan. Drag to orbit, right-drag to pan, scroll to zoom."></canvas>
    <div id="emptyState" class="empty-state"><h2>No scan yet</h2><p id="emptyHint">Open Beacon on your iPhone and scan the room.</p></div>
    <div id="renderError" class="empty-state" hidden><h2>3D view unavailable</h2><p>Enable hardware acceleration or use a browser with WebGL 2 support.</p></div>
    <div id="targetLabel" class="target-label" hidden><span id="targetLabelText"></span></div>
    <aside id="debugPanel" class="debug" aria-label="Debug information" hidden>
      <div class="connection" id="connection" data-state="waiting"><i aria-hidden="true"></i><span id="connectionText" role="status">Connecting</span><span id="frameAge"></span></div>
      <p id="injected" class="notice" hidden>Debug observations · not live camera inference</p>
      <div id="targetCard" class="selection" hidden><strong id="targetName"></strong><span id="targetDistance"></span><span id="targetState"></span><button id="focusTarget" title="Centre the selected target">Locate</button></div>
      <dl id="debugStats"></dl>
      <div id="sceneScale" class="scale" aria-label="Scale: one metre, estimated depth"><span id="scaleBar"></span><span>1 m · estimated depth</span></div>
    </aside>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
