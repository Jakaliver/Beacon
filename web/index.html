<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trident · Room view</title>
</head>
<body>
  <a href="/reconstruction-viewer/">Open room view</a>
  <script>
    const params = new URLSearchParams(location.search);
    const viewer = new URL('/reconstruction-viewer/', location.origin);
    if (params.has('backend')) viewer.searchParams.set('backend', params.get('backend'));
    location.replace(viewer.pathname + viewer.search);
  </script>
</body>
</html>
