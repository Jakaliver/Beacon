<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trident Dev</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161b; }
    body { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  </style>
</head>
<body>
  <!-- Two separate pages and data flows: the simulator only sends sensor data to the backend;
       the reconstruction only receives backend output. -->
  <iframe src="/simulator/" title="Simulator" allow="autoplay"></iframe>
  <iframe src="/reconstruction-viewer/" title="Reconstruction" allow="autoplay; microphone"></iframe>
</body>
</html>
